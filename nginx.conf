server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build files never change, so they can be cached for good.
  # A missing one must be a real 404, never the HTML shell.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell always revalidates, so it never points at files from an older build.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
